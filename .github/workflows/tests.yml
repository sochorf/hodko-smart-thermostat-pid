name: PID regression and Marketplace lifecycle
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pip install --no-deps --require-hashes -r requirements-ha112.txt
      - run: python scripts/check_release.py
      - name: Release tag preflight
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --for-publication --tag "$RELEASE_TAG"
      - name: Reviewed regressions plus migration tests (no network)
        run: python scripts/run_tests.py
